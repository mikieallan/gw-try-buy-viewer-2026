<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>List view · Try & Buy · Grape Witches</title>
    <style>
      :root {
        color-scheme: light;
        --gw-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
        --gw-bg: #f7f6f0;
        --gw-surface: #ffffff;
        --gw-surface-muted: #eeecdf;
        --gw-text: #1a1a1a;
        --gw-heading: #42361d;
        --gw-teal: #123f3d;
        --gw-teal-hover: #1d6763;
        --gw-teal-deep: #0c2b2a;
        --gw-border: #c9c9ba;
        --gw-border-soft: #e5e3db;
        --gw-muted: rgba(66, 54, 29, 0.72);
        --gw-radius: 15px;
        --gw-radius-pill: 50px;
        --gw-shadow: 0 2px 12px rgba(18, 63, 61, 0.08);
        --gw-focus-ring: 0 0 0 3px rgba(18, 63, 61, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--gw-font);
        font-size: 17px;
        line-height: 1.5;
        color: var(--gw-text);
        background: var(--gw-bg);
      }

      .site-banner {
        background: var(--gw-teal);
        color: #f7f6f0;
        text-align: center;
        font-size: 14px;
        letter-spacing: 0.02em;
        padding: 10px 16px;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 20px 40px;
      }

      .page-nav {
        margin-bottom: 18px;
        font-size: 15px;
      }

      .page-nav a {
        color: var(--gw-teal);
        font-weight: 500;
        text-decoration: none;
      }

      .page-nav a:hover {
        color: var(--gw-teal-hover);
        text-decoration: underline;
      }

      .page-nav a[aria-current="page"] {
        color: var(--gw-heading);
        font-weight: 600;
        text-decoration: none;
      }

      .page-header h1 {
        margin: 0 0 6px;
        font-size: clamp(26px, 4vw, 34px);
        font-weight: 400;
        letter-spacing: 0.01em;
        color: var(--gw-heading);
      }

      .muted {
        color: var(--gw-muted);
        font-size: 15px;
      }

      .small {
        font-size: 13px;
      }

      .toolbar {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        margin: 20px 0 14px;
      }

      input,
      select,
      button {
        padding: 11px 18px;
        border-radius: var(--gw-radius-pill);
        border: 1px solid var(--gw-border);
        background: var(--gw-surface);
        color: var(--gw-text);
        font-family: inherit;
        font-size: 15px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input:focus,
      select:focus,
      button:focus-visible {
        outline: none;
        border-color: var(--gw-teal);
        box-shadow: var(--gw-focus-ring);
      }

      button.primary {
        background: var(--gw-teal);
        color: #f7f6f0;
        border-color: var(--gw-teal);
        cursor: pointer;
        font-weight: 500;
      }

      button.primary:hover {
        background: var(--gw-teal-hover);
        border-color: var(--gw-teal-hover);
      }

      button.ghost {
        background: transparent;
        color: var(--gw-teal);
        border-color: var(--gw-teal);
        cursor: pointer;
        font-weight: 500;
      }

      button.ghost:hover {
        background: rgba(18, 63, 61, 0.08);
      }

      .badge-filter-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        cursor: pointer;
        text-align: left;
        font-size: 15px;
      }

      .badge-filter-trigger .badge-filter-summary {
        flex: 1;
        font-size: 14px;
        font-weight: 400;
        color: var(--gw-muted);
        text-align: right;
      }

      .badge-filter-trigger .badge-filter-chevron {
        flex-shrink: 0;
        font-size: 12px;
        color: var(--gw-muted);
      }

      .badge-filter-popover {
        margin: 0 0 16px;
      }

      .badge-filter-popover[hidden] {
        display: none !important;
      }

      .badge-filter-panel {
        background: var(--gw-surface);
        border: 1px solid var(--gw-border-soft);
        border-radius: var(--gw-radius);
        padding: 14px 16px;
        margin: 0;
      }

      .badge-filter-panel legend {
        padding: 0 6px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--gw-muted);
      }

      .badge-filter-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-top: 10px;
        align-items: center;
      }

      .badge-filter-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      .badge-filter-item input {
        width: 1.05rem;
        height: 1.05rem;
        accent-color: var(--gw-teal);
        cursor: pointer;
      }

      .table-wrap {
        margin-top: 16px;
        overflow-x: auto;
        border: 1px solid var(--gw-border-soft);
        border-radius: var(--gw-radius);
        background: var(--gw-surface);
        box-shadow: var(--gw-shadow);
      }

      table.wine-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }

      .wine-table th,
      .wine-table td {
        padding: 12px 14px;
        text-align: left;
        vertical-align: middle;
        border-bottom: 1px solid var(--gw-border-soft);
      }

      .wine-table thead th {
        background: var(--gw-surface-muted);
        color: var(--gw-heading);
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .wine-table tbody tr:hover {
        background: rgba(18, 63, 61, 0.04);
      }

      .wine-table tbody tr:last-child td {
        border-bottom: none;
      }

      .col-thumb {
        width: 56px;
      }

      .col-price {
        width: 88px;
        white-space: nowrap;
      }

      .thumb-tiny {
        width: 48px;
        height: 48px;
        object-fit: contain;
        border-radius: 8px;
        border: 1px solid var(--gw-border-soft);
        background: var(--gw-surface-muted);
        display: block;
      }

      .thumb-placeholder {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        background: var(--gw-surface-muted);
        border: 1px dashed var(--gw-border);
        font-size: 10px;
        color: var(--gw-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.2;
        padding: 4px;
      }

      .wine-name {
        font-weight: 600;
        color: var(--gw-heading);
      }

      .wine-name a {
        color: inherit;
        text-decoration: none;
      }

      .wine-name a:hover {
        color: var(--gw-teal);
        text-decoration: underline;
      }

      .wine-cat {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--gw-muted);
        margin-top: 2px;
      }

      .sort-btn {
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        font: inherit;
        color: inherit;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .sort-btn:hover {
        color: var(--gw-teal);
      }

      .sort-btn .sort-ind {
        font-size: 11px;
        opacity: 0.45;
      }

      .sort-btn[data-active="true"] .sort-ind {
        opacity: 1;
      }

      .list-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }

      .list-badge-wrap {
        position: relative;
        display: inline-flex;
        z-index: 1;
        line-height: 0;
      }

      .list-badge-wrap:hover,
      .list-badge-wrap:focus-within {
        z-index: 40;
      }

      .list-badge-hit {
        display: inline-flex;
        padding: 0;
        margin: 0;
        border: none;
        background: transparent;
        cursor: default;
        border-radius: 6px;
        line-height: 0;
      }

      .list-badge-hit:focus-visible {
        outline: none;
        box-shadow: var(--gw-focus-ring);
      }

      .list-badge-img {
        width: 26px;
        height: 26px;
        object-fit: contain;
        border-radius: 6px;
        border: 1px solid var(--gw-border-soft);
        background: var(--gw-surface-muted);
        display: block;
      }

      .list-badge-tip {
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%);
        width: max-content;
        max-width: min(240px, 70vw);
        padding: 8px 10px;
        background: var(--gw-surface);
        border: 1px solid var(--gw-border);
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(18, 63, 61, 0.12);
        font-size: 11px;
        line-height: 1.4;
        text-align: left;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.12s ease, visibility 0.12s ease;
      }

      .list-badge-tip::after {
        content: "";
        position: absolute;
        bottom: 100%;
        left: 50%;
        margin-left: -5px;
        border: 5px solid transparent;
        border-bottom-color: var(--gw-surface);
        filter: drop-shadow(0 -1px 0 var(--gw-border));
      }

      .list-badge-wrap:hover .list-badge-tip,
      .list-badge-wrap:focus-within .list-badge-tip {
        opacity: 1;
        visibility: visible;
      }

      .list-badge-tip-title {
        display: block;
        font-style: italic;
        font-weight: 500;
        color: var(--gw-heading);
        margin-bottom: 4px;
      }

      .empty {
        padding: 28px;
        text-align: center;
        color: var(--gw-muted);
      }

      #stats {
        color: var(--gw-muted);
        margin-bottom: 4px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="site-banner">Try &amp; Buy tasting list · Grape Witches</div>
    <div class="container">
      <nav class="page-nav" aria-label="Views">
        <a href="index.html">Card view</a>
        <span aria-hidden="true"> · </span>
        <a href="list.html" aria-current="page">List view</a>
      </nav>

      <header class="page-header">
        <h1>All wines</h1>
      </header>

      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="Search name/producer/cuvee..." />
        <select id="categoryFilter" aria-label="Category">
          <option value="">All categories</option>
        </select>
        <button
          type="button"
          id="badgeFilterToggle"
          class="badge-filter-trigger"
          aria-expanded="false"
          aria-haspopup="true"
          aria-controls="badgeFilterPop"
        >
          <span>Badges</span>
          <span id="badgeFilterSummary" class="badge-filter-summary">Any</span>
          <span class="badge-filter-chevron" id="badgeFilterChevron" aria-hidden="true">▾</span>
        </button>
        <button id="resetBtn" type="button" class="primary">Reset</button>
      </div>

      <div id="badgeFilterPop" class="badge-filter-popover" hidden>
        <fieldset class="badge-filter-panel">
          <legend>Filter by badge</legend>
          <p class="muted small" style="margin: 0 0 8px; font-size: 13px">
            Show wines that have <strong>any</strong> of the selected badges. Leave all unchecked to show all.
          </p>
          <div id="badgeFilterGrid" class="badge-filter-grid"></div>
          <button type="button" id="clearBadgesBtn" class="ghost" style="margin-top: 12px">Clear badge filters</button>
        </fieldset>
      </div>

      <div id="stats"></div>

      <div class="table-wrap">
        <table class="wine-table">
          <thead>
            <tr>
              <th class="col-thumb" scope="col">Photo</th>
              <th scope="col">Wine</th>
              <th class="col-price" scope="col">
                <button type="button" class="sort-btn" id="priceSortBtn" aria-label="Sort by price">
                  Price <span class="sort-ind" id="priceSortInd">—</span>
                </button>
              </th>
              <th scope="col">Badges</th>
            </tr>
          </thead>
          <tbody id="wineTableBody"></tbody>
        </table>
        <div id="tableEmpty" class="empty" hidden>No wines match your filters.</div>
      </div>
    </div>

    <script>
      const state = {
        all: [],
        filtered: [],
        priceSort: null,
      };

      function text(value) {
        return (value ?? "").toString();
      }

      function parsePrice(raw) {
        const s = text(raw).replace(/[$,]/g, "").trim();
        const n = parseFloat(s);
        return Number.isFinite(n) ? n : NaN;
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function escapeAttr(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;")
          .replaceAll("<", "&lt;");
      }

      function slugForBadgesId(url) {
        const s = text(url)
          .replace(/^https?:\/\//i, "")
          .replace(/[^a-zA-Z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
        return (s || "wine").slice(0, 48);
      }

      function formatListBadges(badges, cardSlug) {
        if (!Array.isArray(badges) || badges.length === 0) {
          return '<span class="muted" style="font-size:13px">—</span>';
        }
        const slug = cardSlug || "wine";
        const items = badges
          .map((b, idx) => {
            const label = text(b.label);
            const desc = text(b.description);
            const img = text(b.image_url);
            if (!img) {
              return "";
            }
            const tipId = `list-badge-tip-${slug}-${idx}`;
            const a11y = [label, desc].filter(Boolean).join(". ") || "Badge";
            const titleHtml = label
              ? `<span class="list-badge-tip-title">${escapeHtml(label)}</span>`
              : "";
            const bodyHtml = desc ? `<span>${escapeHtml(desc)}</span>` : "";
            return `<span class="list-badge-wrap">
              <button type="button" class="list-badge-hit" aria-describedby="${tipId}" aria-label="${escapeAttr(a11y)}">
                <img class="list-badge-img" src="${escapeAttr(img)}" alt="" loading="lazy" width="26" height="26" />
              </button>
              <span id="${tipId}" class="list-badge-tip" role="tooltip">${titleHtml}${bodyHtml}</span>
            </span>`;
          })
          .filter(Boolean)
          .join("");
        return items ? `<div class="list-badges">${items}</div>` : '<span class="muted" style="font-size:13px">—</span>';
      }

      function collectBadgeLabels(rows) {
        const set = new Set();
        for (const r of rows) {
          const badges = r.gw_badges;
          if (!Array.isArray(badges)) {
            continue;
          }
          for (const b of badges) {
            const lab = text(b.label).trim();
            if (lab) {
              set.add(lab);
            }
          }
        }
        return [...set].sort((a, b) => a.localeCompare(b));
      }

      function populateCategories(data) {
        const select = document.getElementById("categoryFilter");
        select.innerHTML = '<option value="">All categories</option>';
        const categories = [...new Set(data.map((r) => r.category).filter(Boolean))].sort();
        for (const c of categories) {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        }
      }

      function populateBadgeFilters(labels) {
        const grid = document.getElementById("badgeFilterGrid");
        grid.innerHTML = "";
        labels.forEach((lab, i) => {
          const id = `bf-${i}`;
          const wrap = document.createElement("label");
          wrap.className = "badge-filter-item";
          wrap.innerHTML = `<input type="checkbox" name="badge-filter" value="${escapeAttr(lab)}" id="${id}" />
            <span>${escapeHtml(lab)}</span>`;
          grid.appendChild(wrap);
        });
      }

      function getSelectedBadges() {
        return [...document.querySelectorAll('input[name="badge-filter"]:checked')].map((el) => el.value);
      }

      function updateBadgeFilterSummary() {
        const n = getSelectedBadges().length;
        const el = document.getElementById("badgeFilterSummary");
        el.textContent = n === 0 ? "Any" : `${n} selected`;
      }

      function setBadgeFilterOpen(open) {
        const pop = document.getElementById("badgeFilterPop");
        const btn = document.getElementById("badgeFilterToggle");
        const chev = document.getElementById("badgeFilterChevron");
        pop.hidden = !open;
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        chev.textContent = open ? "▴" : "▾";
      }

      function toggleBadgeFilterPanel() {
        const pop = document.getElementById("badgeFilterPop");
        setBadgeFilterOpen(pop.hidden);
      }

      function applyFiltersAndSort() {
        const q = document.getElementById("searchInput").value.trim().toLowerCase();
        const category = document.getElementById("categoryFilter").value;
        const badgePick = getSelectedBadges();

        let rows = state.all.filter((r) => {
          const haystack = [
            r.normalized_name,
            r.raw_wine_line,
            r.producer,
            r.cuvee,
            r.gw_title,
            r.gw_winery_display,
            r.gw_wine_display,
          ]
            .map(text)
            .join(" ")
            .toLowerCase();
          if (q && !haystack.includes(q)) {
            return false;
          }
          if (category && r.category !== category) {
            return false;
          }
          if (badgePick.length > 0) {
            const labels = (r.gw_badges || []).map((b) => text(b.label));
            const matchAny = badgePick.some((b) => labels.includes(b));
            if (!matchAny) {
              return false;
            }
          }
          return true;
        });

        if (state.priceSort === "asc" || state.priceSort === "desc") {
          rows = [...rows].sort((a, b) => {
            const pa = parsePrice(a.gw_price);
            const pb = parsePrice(b.gw_price);
            const na = Number.isFinite(pa);
            const nb = Number.isFinite(pb);
            if (!na && !nb) {
              return 0;
            }
            if (!na) {
              return 1;
            }
            if (!nb) {
              return -1;
            }
            return state.priceSort === "asc" ? pa - pb : pb - pa;
          });
        }

        state.filtered = rows;
        renderTable();
        renderStats();
        updateBadgeFilterSummary();
      }

      function renderTable() {
        const tbody = document.getElementById("wineTableBody");
        const emptyEl = document.getElementById("tableEmpty");
        tbody.innerHTML = "";

        if (state.filtered.length === 0) {
          emptyEl.hidden = false;
          return;
        }
        emptyEl.hidden = true;

        for (const r of state.filtered) {
          const displayName = r.normalized_name || r.raw_wine_line || "(unknown)";
          const thumbSrc = text(r.gw_thumbnail_url);
          const thumbCell = thumbSrc
            ? `<img class="thumb-tiny" src="${escapeAttr(thumbSrc)}" alt="${escapeAttr(displayName)}" width="48" height="48" loading="lazy" />`
            : '<div class="thumb-placeholder">No photo</div>';

          const cat = r.category ? `<span class="wine-cat">${escapeHtml(r.category)}</span>` : "";
          const priceDisp = escapeHtml(text(r.gw_price || "—"));
          const badgesHtml = formatListBadges(r.gw_badges, slugForBadgesId(r.grape_witches_url));

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="col-thumb">${thumbCell}</td>
            <td>
              <span class="wine-name"><a href="${escapeAttr(text(r.grape_witches_url))}" target="_blank" rel="noopener">${escapeHtml(displayName)}</a></span>
              ${cat}
            </td>
            <td class="col-price">${priceDisp}</td>
            <td>${badgesHtml}</td>
          `;
          tbody.appendChild(tr);
        }
      }

      function renderStats() {
        const all = state.all.length;
        const shown = state.filtered.length;
        document.getElementById("stats").textContent = `Showing ${shown} of ${all} wines`;
      }

      function updatePriceSortUI() {
        const btn = document.getElementById("priceSortBtn");
        const ind = document.getElementById("priceSortInd");
        if (state.priceSort === "asc") {
          ind.textContent = "↑";
          btn.setAttribute("data-active", "true");
          btn.setAttribute("aria-sort", "ascending");
        } else if (state.priceSort === "desc") {
          ind.textContent = "↓";
          btn.setAttribute("data-active", "true");
          btn.setAttribute("aria-sort", "descending");
        } else {
          ind.textContent = "—";
          btn.setAttribute("data-active", "false");
          btn.removeAttribute("aria-sort");
        }
      }

      function cyclePriceSort() {
        if (state.priceSort === null) {
          state.priceSort = "asc";
        } else if (state.priceSort === "asc") {
          state.priceSort = "desc";
        } else {
          state.priceSort = null;
        }
        updatePriceSortUI();
        applyFiltersAndSort();
      }

      function resetAll() {
        document.getElementById("searchInput").value = "";
        document.getElementById("categoryFilter").value = "";
        document.querySelectorAll('input[name="badge-filter"]').forEach((el) => {
          el.checked = false;
        });
        state.priceSort = null;
        setBadgeFilterOpen(false);
        updatePriceSortUI();
        applyFiltersAndSort();
      }

      document.getElementById("searchInput").addEventListener("input", applyFiltersAndSort);
      document.getElementById("categoryFilter").addEventListener("change", applyFiltersAndSort);
      document.getElementById("resetBtn").addEventListener("click", resetAll);
      document.getElementById("badgeFilterToggle").addEventListener("click", (ev) => {
        ev.stopPropagation();
        toggleBadgeFilterPanel();
      });
      document.getElementById("badgeFilterGrid").addEventListener("change", (ev) => {
        if (ev.target.matches('input[name="badge-filter"]')) {
          applyFiltersAndSort();
        }
      });
      document.getElementById("clearBadgesBtn").addEventListener("click", () => {
        document.querySelectorAll('input[name="badge-filter"]').forEach((el) => {
          el.checked = false;
        });
        applyFiltersAndSort();
      });
      document.getElementById("priceSortBtn").addEventListener("click", cyclePriceSort);

      document.addEventListener("click", () => {
        const pop = document.getElementById("badgeFilterPop");
        if (!pop.hidden) {
          setBadgeFilterOpen(false);
        }
      });
      document.getElementById("badgeFilterPop").addEventListener("click", (ev) => {
        ev.stopPropagation();
      });

      document.addEventListener("keydown", (ev) => {
        if (ev.key !== "Escape") {
          return;
        }
        const pop = document.getElementById("badgeFilterPop");
        if (!pop.hidden) {
          setBadgeFilterOpen(false);
        }
      });

      async function init() {
        const response = await fetch("/data/try_buy_wines_enriched.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load data file (${response.status}).`);
        }
        const data = await response.json();
        state.all = data;
        populateCategories(state.all);
        populateBadgeFilters(collectBadgeLabels(state.all));
        updatePriceSortUI();
        applyFiltersAndSort();
      }

      init().catch((err) => {
        document.getElementById("stats").textContent = err.message;
      });
    </script>
  </body>
</html>
